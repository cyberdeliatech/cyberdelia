<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Academia E-Commerce</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"></script>
<style>
:root{--bg:#0b0e14;--panel:#11151f;--card:#161b27;--line:#232a3a;--txt:#e8ecf4;--mut:#8b93a7;--acc:#6c8cff;--grn:#34c98a}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--txt);display:flex;min-height:100vh}
#side{width:290px;min-width:290px;background:var(--panel);border-right:1px solid var(--line);padding:18px 14px;position:sticky;top:0;height:100vh;overflow:auto}
.logo{font-weight:800;font-size:19px;margin-bottom:4px}
.logo span{color:var(--acc)}
.sub{color:var(--mut);font-size:12px;margin-bottom:18px}
.cbtn{width:100%;text-align:left;background:transparent;border:1px solid transparent;color:var(--txt);padding:10px 12px;border-radius:12px;cursor:pointer;display:flex;align-items:center;gap:10px;margin-bottom:6px;font-size:14px}
.cbtn:hover{background:var(--card)}
.cbtn.on{background:var(--card);border-color:var(--line)}
.cbtn .em{font-size:20px}
.cmeta{flex:1;min-width:0}
.cname{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pbar{height:4px;background:var(--line);border-radius:4px;margin-top:5px;overflow:hidden}
.pfill{height:100%;background:linear-gradient(90deg,var(--acc),#9b6cff);width:0}
.pnum{font-size:11px;color:var(--mut)}
#main{flex:1;min-width:0}
#top{position:sticky;top:0;background:rgba(11,14,20,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:14px 22px;display:flex;gap:14px;align-items:center;z-index:5}
#top h1{font-size:18px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#q{background:var(--card);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:9px 13px;width:230px;font-size:13px;outline:none}
#q:focus{border-color:var(--acc)}
#wrap{padding:22px;max-width:980px}
.ch{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:14px;overflow:hidden}
.ch summary{cursor:pointer;padding:14px 18px;font-weight:600;font-size:15px;display:flex;justify-content:space-between;align-items:center;list-style:none}
.ch summary::-webkit-details-marker{display:none}
.ch summary small{color:var(--mut);font-weight:400}
.les{display:flex;align-items:center;gap:12px;padding:11px 18px;border-top:1px solid var(--line);cursor:pointer}
.les:hover{background:#1b2232}
.les .num{width:26px;height:26px;border-radius:50%;background:#222a3c;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--mut);flex:none}
.les .tt{flex:1;font-size:14px}
.les.dne .tt{color:var(--mut);text-decoration:line-through}
.chk{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);background:none;cursor:pointer;flex:none;color:#fff;font-size:11px;line-height:1}
.dne .chk{background:var(--grn);border-color:var(--grn)}
.res{font-size:12px;color:var(--mut);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:2px 8px;flex:none}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
#modal.on{display:flex}
#box{background:var(--panel);border:1px solid var(--line);border-radius:16px;width:min(920px,100%);overflow:hidden}
#vhead{display:flex;align-items:center;gap:10px;padding:13px 16px}
#vhead h3{flex:1;font-size:15px;font-weight:600}
#vclose{background:none;border:none;color:var(--mut);font-size:22px;cursor:pointer}
#video{width:100%;aspect-ratio:16/9;background:#000;display:block}
#vfoot{display:flex;gap:10px;padding:12px 16px;align-items:center;flex-wrap:wrap}
.btn{background:var(--card);border:1px solid var(--line);color:var(--txt);padding:8px 14px;border-radius:10px;cursor:pointer;font-size:13px}
.btn:hover{border-color:var(--acc)}
.btn.acc{background:var(--acc);border-color:var(--acc);color:#fff}
#vinfo{flex:1;color:var(--mut);font-size:12px}
@media(max-width:820px){body{flex-direction:column}#side{width:100%;min-width:0;height:auto;position:static;display:flex;gap:8px;overflow-x:auto;padding:12px}.cbtn{width:auto;flex:none;margin:0}.pbar,.pnum{display:none}#q{width:130px}}
</style>
</head>
<body>
<aside id="side">
  <div class="logo">Academia <span>E-Commerce</span></div>
  <div class="sub">7 cursos · 208 clases</div>
  <div id="clist"></div>
</aside>
<main id="main">
  <div id="top"><h1 id="ctitle"></h1><input id="q" placeholder="Buscar clase..."></div>
  <div id="wrap"></div>
</main>
<div id="modal"><div id="box">
  <div id="vhead"><h3 id="vtitle"></h3><button id="vclose">×</button></div>
  <video id="video" controls playsinline></video>
  <div id="vfoot">
    <button class="btn" id="vprev">← Anterior</button>
    <button class="btn" id="vnext">Siguiente →</button>
    <button class="btn acc" id="vmark">Marcar vista</button>
    <span id="vinfo"></span>
    <a class="btn" id="vlink" target="_blank" rel="noopener">Abrir enlace</a>
  </div>
</div></div>

const state = {
  course: 0,
  current: null,
  completed: JSON.parse(localStorage.getItem("academia_completed") || "{}")
};

const $ = id => document.getElementById(id);

function saveProgress() {
  localStorage.setItem("academia_completed", JSON.stringify(state.completed));
}

function courseLessons(courseIndex) {
  const course = DATA[courseIndex];
  const result = [];
  course[2].forEach(section => {
    section[1].forEach(lesson => {
      result.push({
        title: lesson[0],
        id: lesson[1],
        sig: lesson[2],
        section: section[0]
      });
    });
  });
  return result;
}

function courseProgress(courseIndex) {
  const lessons = courseLessons(courseIndex);
  if (!lessons.length) return { done: 0, total: 0, pct: 0 };
  const done = lessons.filter(x => state.completed[x.id]).length;
  return { done, total: lessons.length, pct: Math.round(done / lessons.length * 100) };
}

function renderCourses() {
  const list = $("clist");
  list.innerHTML = "";

  DATA.forEach((course, i) => {
    const p = courseProgress(i);
    const btn = document.createElement("button");
    btn.className = "cbtn" + (i === state.course ? " on" : "");
    btn.type = "button";
    btn.innerHTML = `
      <span class="em">${course[1]}</span>
      <span class="cmeta">
        <span class="cname">${escapeHtml(course[0])}</span>
        <span class="pbar"><span class="pfill" style="width:${p.pct}%"></span></span>
        <span class="pnum">${p.done}/${p.total} · ${p.pct}%</span>
      </span>
    `;
    btn.addEventListener("click", () => {
      state.course = i;
      $("q").value = "";
      renderCourses();
      renderCourse();
    });
    list.appendChild(btn);
  });
}

function renderCourse(filter = "") {
  const course = DATA[state.course];
  $("ctitle").textContent = course[0];

  const query = filter.trim().toLowerCase();
  const wrap = $("wrap");
  wrap.innerHTML = "";

  course[2].forEach((section, sectionIndex) => {
    const matches = section[1].filter(lesson =>
      !query ||
      lesson[0].toLowerCase().includes(query) ||
      section[0].toLowerCase().includes(query)
    );

    if (!matches.length) return;

    const details = document.createElement("details");
    details.className = "ch";
    details.open = Boolean(query) || sectionIndex === 0;

    const summary = document.createElement("summary");
    summary.innerHTML = `
      <span>${escapeHtml(section[0])}</span>
      <small>${matches.length} clase${matches.length === 1 ? "" : "s"}</small>
    `;
    details.appendChild(summary);

    matches.forEach((lesson, index) => {
      const row = document.createElement("div");
      const done = Boolean(state.completed[lesson[1]]);
      row.className = "les" + (done ? " dne" : "");
      row.innerHTML = `
        <span class="num">${index + 1}</span>
        <span class="tt">${escapeHtml(lesson[0])}</span>
        <span class="res">${done ? "Vista" : "Video"}</span>
        <button class="chk" type="button" aria-label="${done ? "Marcar como no vista" : "Marcar como vista"}">${done ? "✓" : ""}</button>
      `;

      row.addEventListener("click", event => {
        if (event.target.closest(".chk")) {
          event.stopPropagation();
          toggleComplete(lesson[1]);
          renderCourse($("q").value);
          renderCourses();
          if (state.current && state.current.id === lesson[1]) updateVideoInfo();
          return;
        }
        openLesson(lesson);
      });

      details.appendChild(row);
    });

    wrap.appendChild(details);
  });

  if (!wrap.children.length) {
    wrap.innerHTML = `<div class="ch"><div style="padding:18px;color:var(--mut)">No se encontraron clases.</div></div>`;
  }
}

function toggleComplete(id) {
  if (state.completed[id]) {
    delete state.completed[id];
  } else {
    state.completed[id] = true;
  }
  saveProgress();
}

function flattenCourse() {
  return courseLessons(state.course);
}

function openLesson(lesson) {
  state.current = lesson;
  $("vtitle").textContent = lesson.title;
  $("vlink").href = vidUrl(lesson.id, lesson.sig);
  $("modal").classList.add("on");
  document.body.style.overflow = "hidden";
  loadVideo(lesson);
  updateVideoInfo();
}

function loadVideo(lesson) {
  const video = $("video");

  if (window.currentHls) {
    try { window.currentHls.destroy(); } catch (_) {}
    window.currentHls = null;
  }

  video.pause();
  video.removeAttribute("src");
  video.load();

  const url = vidUrl(lesson.id, lesson.sig);

  if (window.Hls && Hls.isSupported()) {
    const hls = new Hls({
      enableWorker: true,
      lowLatencyMode: false
    });
    window.currentHls = hls;
    hls.loadSource(url);
    hls.attachMedia(video);

    hls.on(Hls.Events.ERROR, (_, data) => {
      if (data && data.fatal) {
        $("vinfo").textContent = "No se pudo cargar el video.";
      }
    });
  } else if (video.canPlayType("application/vnd.apple.mpegurl")) {
    video.src = url;
  } else {
    $("vinfo").textContent = "Este navegador no admite reproducción HLS.";
  }
}

function updateVideoInfo() {
  if (!state.current) return;
  const lessons = flattenCourse();
  const index = lessons.findIndex(x => x.id === state.current.id);
  const p = courseProgress(state.course);

  $("vinfo").textContent =
    `${index + 1} de ${lessons.length} · ${state.completed[state.current.id] ? "Vista" : "No vista"} · Curso ${p.pct}%`;
  $("vmark").textContent =
    state.completed[state.current.id] ? "Marcar no vista" : "Marcar vista";
}

function navigateLesson(direction) {
  if (!state.current) return;
  const lessons = flattenCourse();
  const index = lessons.findIndex(x => x.id === state.current.id);
  const nextIndex = index + direction;

  if (nextIndex < 0 || nextIndex >= lessons.length) return;
  openLesson(lessons[nextIndex]);
}

function closeModal() {
  const video = $("video");
  video.pause();

  if (window.currentHls) {
    try { window.currentHls.destroy(); } catch (_) {}
    window.currentHls = null;
  }

  video.removeAttribute("src");
  video.load();

  $("modal").classList.remove("on");
  document.body.style.overflow = "";
  state.current = null;
}

function escapeHtml(value) {
  return String(value).replace(/[&<>"']/g, ch => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  }[ch]));
}

$("q").addEventListener("input", event => {
  renderCourse(event.target.value);
});

$("vclose").addEventListener("click", closeModal);
$("vprev").addEventListener("click", () => navigateLesson(-1));
$("vnext").addEventListener("click", () => navigateLesson(1));

$("vmark").addEventListener("click", () => {
  if (!state.current) return;
  toggleComplete(state.current.id);
  renderCourse($("q").value);
  renderCourses();
  updateVideoInfo();
});

$("modal").addEventListener("click", event => {
  if (event.target === $("modal")) closeModal();
});

document.addEventListener("keydown", event => {
  if (!$("modal").classList.contains("on")) return;

  if (event.key === "Escape") closeModal();
  if (event.key === "ArrowLeft") navigateLesson(-1);
  if (event.key === "ArrowRight") navigateLesson(1);
});

$("video").addEventListener("ended", () => {
  if (!state.current) return;
  if (!state.completed[state.current.id]) {
    state.completed[state.current.id] = true;
    saveProgress();
    renderCourse($("q").value);
    renderCourses();
    updateVideoInfo();
  }
});

document.querySelector('.sub').textContent = DATA.length + ' cursos · ' + DATA.reduce((n,c)=>n+c[2].reduce((m,x)=>m+x[1].length,0),0) + ' clases';
renderCourses();
renderCourse();

</script>

      window.currentHls = hls;
      let netTries = 0, mediaTries = 0;
      hls.on(Hls.Events.MANIFEST_PARSED, () => { video.play().catch(() => {}); });
      hls.on(Hls.Events.ERROR, (_, d) => {
        if (!d || !d.fatal) return;
        if (d.type === Hls.ErrorTypes.NETWORK_ERROR && netTries++ < 3) { hls.startLoad(); return; }
        if (d.type === Hls.ErrorTypes.MEDIA_ERROR && mediaTries++ < 2) { hls.recoverMediaError(); return; }
        info.textContent = "No se pudo reproducir el video (" + (d.details || d.type) + ").";
        destroyHls();
      });
      hls.attachMedia(video);
      hls.loadSource(url);
    } else if (video.canPlayType("application/vnd.apple.mpegurl")) {
      video.src = url;
      video.play().catch(() => {});
    } else {
      info.textContent = "Este navegador no admite reproducción HLS.";
    }
  }

  // Reemplaza al loadVideo original (openLesson lo llama por nombre).
  window.loadVideo = async function (lesson) {
    const my = ++seq;
    destroyHls();
    video.pause();
    video.removeAttribute("src");
    video.load();
    info.textContent = "Cargando video…";

    const res = await resolveUrl(lesson, my);
    if (!res || my !== seq || !state.current || state.current.id !== lesson.id) return;
    if (!res.url) {
      info.textContent = "Mux rechazó el token (403): puede estar vencido o el dominio no está permitido.";
      return;
    }
    link.href = res.url;
    play(res.url);
  };
})();
</script>
